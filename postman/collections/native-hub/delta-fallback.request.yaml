{
  "$kind": "http-request",
  "name": "delta-fallback",
  "order": 7000,
  "url": "{{baseUrl}}/api/ingest/delta",
  "method": "POST",
  "headers": [
    {
      "key": "Authorization",
      "value": "Bearer {{hubSecret}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if (!/^http:\\/\\/127\\.0\\.0\\.1:\\d+$/.test(pm.variables.get(\"baseUrl\"))) { throw new Error(\"Use an isolated loopback Hub fixture\"); }"
    },
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test(\"delta-fallback contract\", function () { pm.response.to.have.status(404);  });"
    }
  ],
  "body": {
    "type": "json",
    "content": "{}"
  }
}
